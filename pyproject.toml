[project]
name = "parental-control"
version = "0.1.0"
description = "Parental control for Windows: agent, server and shared protocol"
requires-python = ">=3.12"
dependencies = ["pc-shared", "pc-agent", "pc-server"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["shared", "agent", "server"]

[tool.uv.sources]
pc-shared = { workspace = true }
pc-agent = { workspace = true }
pc-server = { workspace = true }

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyinstaller>=6.22.3",
    "pytest>=8",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["agent/tests", "server/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["pc_agent", "pc_server", "pc_shared"]
