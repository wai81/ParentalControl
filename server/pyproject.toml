[project]
name = "pc-server"
version = "0.1.0"
description = "Parental control server: agent sync API and web panel for the parent"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "click>=8.5.1",
    "fastapi>=0.163.2",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "pc-shared",
    "pydantic-settings>=2.16.3",
    "python-multipart>=0.0.34",
    "sqlalchemy[asyncio]>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
pc_server = "pc_server.cli:cli"

[tool.uv.sources]
pc-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

