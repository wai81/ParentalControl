{# Inline SVG icons (24x24, stroke). Usage: {% from "_icons.html" import icon %} {{ icon("clock") }} #}
{% macro icon(name, cls="icon") -%}
<svg class="{{ cls }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if name == "clock" -%}<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
{%- elif name == "shield" -%}<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>
{%- elif name == "monitor" -%}<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>
{%- elif name == "app" -%}<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M4 9h16"/>
{%- elif name == "window" -%}<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18M7 7h.01M10 7h.01"/>
{%- elif name == "ban" -%}<circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/>
{%- elif name == "logout" -%}<path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l-5-5 5-5M5 12h11"/>
{%- elif name == "alert" -%}<path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17h.01"/>
{%- elif name == "globe" -%}<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 3 2.5 15 0 18M12 3c-2.5 3-2.5 15 0 18"/>
{%- elif name == "user" -%}<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>
{%- elif name == "key" -%}<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3"/>
{%- elif name == "power" -%}<path d="M12 3v9M6.3 7.3a8 8 0 1 0 11.4 0"/>
{%- elif name == "lock" -%}<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>
{%- elif name == "unlock" -%}<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 7.5-2"/>
{%- elif name == "plus" -%}<path d="M12 5v14M5 12h14"/>
{%- elif name == "minus" -%}<path d="M5 12h14"/>
{%- elif name == "back" -%}<path d="M15 18l-6-6 6-6"/>
{%- elif name == "copy" -%}<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>
{%- elif name == "check" -%}<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>
{%- elif name == "info" -%}<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>
{%- elif name == "moon" -%}<path d="M20 14A8 8 0 1 1 10 4a6 6 0 0 0 10 10z"/>
{%- else -%}<circle cx="12" cy="12" r="3"/>
{%- endif -%}
</svg>
{%- endmacro %}
