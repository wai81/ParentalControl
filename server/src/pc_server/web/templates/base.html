<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Родительский контроль{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="top">
    <a class="brand" href="/">Родительский контроль</a>
    {% if request.session.get('parent') %}
    <form method="post" action="/logout" class="inline">
      <input type="hidden" name="csrf" value="{{ csrf_token(request) }}">
      <button class="link">Выйти</button>
    </form>
    {% endif %}
  </header>
  <main>
    {% if flash %}<p class="flash {{ 'ok' if flash.ok else 'bad' }}">{{ flash.text }}</p>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
