{% extends "base.html" %}
{% block title %}Вход{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Вход для родителя</h1>
  {% if not has_password %}
    <p class="bad">Пароль ещё не задан. На сервере выполните:</p>
    <pre>pc_server set-password</pre>
  {% else %}
    {% if error %}<p class="flash bad">{{ error }}</p>{% endif %}
    <form method="post" action="/login">
      <label>Пароль <input type="password" name="password" autofocus required autocomplete="current-password"></label>
      <button class="primary">Войти</button>
    </form>
  {% endif %}
</section>
{% endblock %}
